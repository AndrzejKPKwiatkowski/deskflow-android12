name: Zbuduj Deskflow dla Androida 12

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz to repozytorium (z łatką)
        uses: actions/checkout@v4

      - name: Pobierz kod źródłowy Deskflow Android
        run: git clone https://github.com/jglanz/deskflow-android.git src

      - name: Nałóż łatkę dla Androida 12
        working-directory: src
        run: git apply --verbose ../deskflow-android12.patch

      - name: Zainstaluj Javę 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Przygotuj Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Zbuduj APK
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Udostępnij APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: deskflow-android12-apk
          path: src/app/build/outputs/apk/debug/*.apk

      - name: Sprawdź zgodność z Androidem 12 (lint)
        working-directory: src
        continue-on-error: true
        run: ./gradlew :app:lintDebug -Dlint.baselines.continue=true

      - name: Pokaż wywołania niedostępne na Androidzie 12
        if: always()
        working-directory: src
        run: |
          f=$(ls app/build/reports/lint-results-debug.xml 2>/dev/null || true)
          if [ -n "$f" ]; then
            grep -B1 -A6 'id="NewApi"' "$f" | grep -E 'message=|file=' || echo "Brak problemów NewApi"
          else
            echo "Brak raportu lint"
          fi

      - name: Udostępnij raport zgodności
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raport-lint
          path: src/app/build/reports/lint-results-debug.*
